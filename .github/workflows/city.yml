name: Profile Visuals

on:
  schedule:
    - cron: "10 * * * *"   # cada hora, al minuto 15
  workflow_dispatch:       # botón manual en la pestaña Actions
  push:
    branches: [main]       # se actualiza en cada push tuyo
    paths-ignore:
      - city.svg
      - stats.svg

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for GitHub to count the new commit
        if: github.event_name == 'push'
        run: sleep 45

      - name: Generate city.svg and stats.svg
        run: |
          python scripts/generate_city.py
          python scripts/generate_stats.py
        env:
          # Opcional: secret GH_PAT (token con scope read:user) para incluir
          # contribuciones privadas. Si no existe, usa GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: vicente-arriagada-lost

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city.svg stats.svg
          git diff --cached --quiet || (git commit -m "chore: update profile visuals" && git pull --rebase && git push)
