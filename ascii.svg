<style>
.ascii-row {
    opacity: 0;
    animation: appear 0.45s ease-out forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateX(-12px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}
</style>

